name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          CHANGELOG="Assets/BoostOps/CHANGELOG.md"
          if [ -f "$CHANGELOG" ]; then
            BODY=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" "$CHANGELOG")
          fi
          if [ -z "$BODY" ]; then
            BODY="Release v${VERSION}"
          fi
          {
            echo "BODY<<GHEOF"
            echo "$BODY"
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.VERSION }} — BoostOps Attribution SDK"
          body: |
            ${{ steps.changelog.outputs.BODY }}

            ## Installation

            **Unity Package Manager (recommended):**
            ```
            https://github.com/BoostOps/boostops-unity-attribution-sdk.git?path=/Assets/BoostOps#v${{ steps.version.outputs.VERSION }}
            ```

            **manifest.json:**
            ```json
            {
              "dependencies": {
                "io.boostops.attribution-sdk": "https://github.com/BoostOps/boostops-unity-attribution-sdk.git?path=/Assets/BoostOps#v${{ steps.version.outputs.VERSION }}"
              }
            }
            ```
          files: |
            Build/AssetStore/*.unitypackage
          generate_release_notes: false
