name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify .unitypackage is present for this tag
        # If we ever push a v* tag without the matching .unitypackage committed
        # to Build/AssetStore/, fail fast instead of silently shipping a
        # release with zero assets. softprops/action-gh-release treats an empty
        # files glob as success, which is how v1.1.0 went out without a package.
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          EXPECTED="Build/AssetStore/boostops-attribution-sdk-${VERSION}.unitypackage"
          if [ ! -f "$EXPECTED" ]; then
            echo "::error::Missing $EXPECTED. The release workflow refuses to publish a tag without its matching .unitypackage."
            echo "Build/AssetStore directory contents:"
            ls -la Build/AssetStore || echo "(directory does not exist)"
            exit 1
          fi
          echo "Found release asset: $EXPECTED ($(du -h "$EXPECTED" | cut -f1))"

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          CHANGELOG="Assets/BoostOps/CHANGELOG.md"
          if [ -f "$CHANGELOG" ]; then
            BODY=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" "$CHANGELOG")
          fi
          if [ -z "$BODY" ]; then
            BODY="Release v${VERSION}"
          fi
          {
            echo "BODY<<GHEOF"
            echo "$BODY"
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.VERSION }} — BoostOps Attribution SDK"
          body: |
            ${{ steps.changelog.outputs.BODY }}

            ## Installation

            **Unity Package Manager (recommended):**
            ```
            https://github.com/BoostOps/boostops-unity-attribution-sdk.git?path=/Assets/BoostOps#v${{ steps.version.outputs.VERSION }}
            ```

            **manifest.json:**
            ```json
            {
              "dependencies": {
                "io.boostops.attribution-sdk": "https://github.com/BoostOps/boostops-unity-attribution-sdk.git?path=/Assets/BoostOps#v${{ steps.version.outputs.VERSION }}"
              }
            }
            ```
          files: |
            Build/AssetStore/boostops-attribution-sdk-${{ steps.version.outputs.VERSION }}.unitypackage
          fail_on_unmatched_files: true
          generate_release_notes: false
